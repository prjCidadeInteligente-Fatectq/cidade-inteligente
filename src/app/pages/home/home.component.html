<div class="page">
    <header class="header">
        <h1 class="section-title">Visão geral</h1>
        <app-complaint-counter></app-complaint-counter>
        <app-priority-cards></app-priority-cards>
    </header>

    <main class="content">
        <section class="need-attention">
            <article class="section-header">
                <h1 class="section-title">Atenção necessária - Denúncias realizadas há mais de uma semana</h1>
                <app-options optionOne="Mais antiga" optionTwo="Menos antiga"
                (SelectedOption)="OrderComplaints()"></app-options>
            </article>

            <article class="container">
                @if (isLoadingComplaints) {
                    <div class="complaints-skeleton" aria-label="Carregando denúncias">
                        @for (item of [1, 2, 3]; track item) { <span></span> }
                    </div>
                } @else {
                    <app-need-attention [complaintsWithOldTimeRange]="complaintsWithOldTimeRange"></app-need-attention>
                }
            </article>
        </section>

        <section class="panel">
            <h1 class="section-title">Esse mês</h1>
            @if (isLoadingComplaints) {
                <div class="calendar-skeleton" aria-label="Carregando calendário">
                    @for (item of [1, 2, 3, 4, 5, 6]; track item) { <span></span> }
                </div>
            } @else {
                <app-month [complaints]="complaintsWithOldTimeRange"></app-month>
            }
        </section>
    </main>

    <footer class="footer">
        <i class="fa-solid fa-map-location-dot"></i>
        Adicionar denúncias por bairro no mapa
    </footer>
</div>
