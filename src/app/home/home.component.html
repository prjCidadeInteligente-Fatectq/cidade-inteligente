<div class="page">
    <header class="header">
        <h1 class="section-title">Visão geral</h1>
        <app-complaint-counter [complaints]="complaints"></app-complaint-counter>
        <app-priority-cards [filteredComplaints]="complaints.filter(c => c.complaintStatus !== 'CONCLUÍDA')"></app-priority-cards>
    </header>

    <main class="content">
        <section class="panel">
            <h1 class="section-title">Atenção necessária</h1>
            <p class="placeholder">Nenhum alerta crítico no momento.</p>
        </section>

        <section class="panel">
            <h1 class="section-title">Essa semana</h1>
            <p class="placeholder">Resumo dos indicadores da semana.</p>
        </section>
    </main>

    <footer class="footer">
        <i class="fa-solid fa-map-location-dot"></i>
        Adicionar denúncias por bairro no mapa
    </footer>
</div>
