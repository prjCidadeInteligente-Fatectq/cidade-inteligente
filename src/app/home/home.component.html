<div class="page">
    <header class="header">
        <h1 class="section-title">Visão geral</h1>
        <app-complaint-counter [complaints]="complaints"></app-complaint-counter>
        <app-priority-cards [filteredComplaints]="complaints.filter(c => c.complaintStatus !== 'CONCLUÍDA')"></app-priority-cards>
    </header>

    <main class="content">
        <section class="need-attention">
            <h1 class="section-title">Atenção necessária - Denúncias realizadas há mais de uma semana</h1>
            <article class="container">
                <app-need-attention [filteredComplaints]="complaints.filter(c => c.complaintStatus !== 'CONCLUÍDA')"></app-need-attention>
            </article>
        </section>

        <section class="panel">
            <h1 class="section-title">Esse mês</h1>
            <app-month [complaints]="complaints"></app-month>
        </section>
    </main>

    <footer class="footer">
        <i class="fa-solid fa-map-location-dot"></i>
        Adicionar denúncias por bairro no mapa
    </footer>
</div>
