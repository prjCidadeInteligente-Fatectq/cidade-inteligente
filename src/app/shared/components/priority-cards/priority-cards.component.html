@if (isLoading) {
  <section class="cards" aria-label="Carregando prioridades">
    @for (item of [1, 2, 3]; track item) {
      <article class="card priority-skeleton"><div></div><span></span><span></span><span></span></article>
    }
  </section>
} @else {
<section class="cards">
    @for (priority of priorities; track priority.name) {
        <article class="card" (mouseenter)="activeMenuPriority = null">
            <header class="header" [style.background-color]="priority.color">
                <span>PRIORIDADE {{ priority.name }} - {{ priority.quantity }} {{priority.quantity === 1 ? 'bairro' : 'bairros'}}</span>
                
                <app-options
                    (SelectedOption)="OrderComplaints($event)"
                    (MenuChanges)="toggleMenu(priority.name, $event)"
                    [isMenuOpen]="activeMenuPriority === priority.name"
                    optionOne="A &rarr; Z" optionTwo=" Z &rarr; A"
                    optionThree="Mais denúncias" optionFour="Menos denúncias"
                    >
                </app-options>
            </header>
        
            <div class="neighborhoods">
                <app-neighborhoods 
                    (ShowComplaints)="OpenModal($event)"
                    [filteredNeighborhoods]="neighborhoods.filter(n => n.priority === priority.name)">
                </app-neighborhoods>
            </div>
        </article>
    }
</section>
}

@if (isModalOpen) {
    <app-complaints-modal 
        [neighborhoodName]="selectedNeighborhood"
        [filteredComplaints]="complaints"
        [isLoading]="isLoadingComplaints"
        (HideComplaints)="CloseModal()">
    </app-complaints-modal>
}
