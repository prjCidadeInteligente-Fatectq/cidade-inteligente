@for (complaint of filteredComplaints; track complaint.id) {
    <article class="card">
        <button (click)="toggleExpand(complaint.id)" class="complaint" [class.expanded]="isExpanded(complaint.id)">
            <header class="header">
                <div class="info" [class.expanded]="isExpanded(complaint.id)">
                    <div class="main-info">
                        <span class="desc">{{ complaint.problem }}</span>
                        <small class="small">
                            <i class="fa-solid fa-location-dot"></i>
                            {{ complaint.street }}
                        </small>
                        <small class="small">
                            <i class="fa-regular fa-calendar-days"></i>
                            Denúncia realizada em: {{ complaint.date }}
                        </small>
                    </div>

                    @if (isExpanded(complaint.id)) {
                        <span class="complaint-description">Descrição: {{ complaint.description }}.</span>
                    }  
                </div>

                @if (isExpanded(complaint.id)) {
                    <div class="images">
                        @for (imagePath of complaint.imagesPaths; track imagePath) {
                            <img [src]="imagePath">
                        }
                    </div>
                }   
        
                <div class="additional-info">
                    <span class="status" style="background-color: #fef3c7; color: #92400e">{{ complaint.complaintStatus }}</span>
        
                    @if (!isExpanded(complaint.id)) {
                        <i class="fa-solid fa-chevron-down" style="color: #181818;"></i>
                    } @else {
                        <i class="fa-solid fa-chevron-up" style="color: #181818;"></i>
                    }
                </div>
            </header>
        </button>
    </article>
}
