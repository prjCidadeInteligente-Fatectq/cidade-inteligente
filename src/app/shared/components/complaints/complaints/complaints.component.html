@for (complaint of filteredComplaints; track complaint.id) {
    @let statusStyle = getStatusStyle(complaint.status);

    <article class="card">
        <button (click)="toggleExpand(complaint.id)" class="complaint" [class.expanded]="isExpanded(complaint.id)">
            <header class="header">
                <div class="info" [class.expanded]="isExpanded(complaint.id)">
                    <div class="main-info">
                        <span class="desc">{{ complaint.problem }}</span>
                        <small class="small">
                            <i class="fa-solid fa-location-dot"></i>
                            {{ complaint.street }}, {{ complaint.neighborhood }}
                        </small>
                        <small class="small">
                            <i class="fa-regular fa-calendar-days"></i>
                            Denúncia realizada em: {{ formatRegisterDate(complaint.register_date) }}
                        </small>
                    </div>

                    @if (isExpanded(complaint.id)) {
                        <span class="complaint-description">Descrição: {{ complaint.description ? complaint.description : 'não possui descrição cadastrada.'}}.</span>
                    }  
                </div>

                @if (isExpanded(complaint.id)) {
                    <div class="images">
                        @if (complaint.image_path) {
                            <img [src]="complaint.image_path">
                        } @else {
                            <span class="small">Não possui imagem cadastrada.</span>
                        }
                        
                    </div>
                }   
        
                <div class="additional-info">
                    <span class="status" [style.background-color]="statusStyle.backgroundColor" [style.color]="statusStyle.color">{{ complaint.status }}</span>
        
                    @if (!isExpanded(complaint.id)) {
                        <i class="fa-solid fa-chevron-down" style="color: #181818;"></i>
                    } @else {
                        <i class="fa-solid fa-chevron-up" style="color: #181818;"></i>
                    }

                    <app-options buttonText="&vellip;" (SelectedOption)="handleOption($event, complaint)"
                     (click)="$event.stopPropagation()"
                     optionThree="Editar" optionFour="Excluir"></app-options>
                </div>
            </header>
        </button>
    </article>
}

@if (selectedComplaintId) {
    <app-edit-complaint-modal (HideForm)="CloseModal()" (SaveComplaint)="SaveComplaint($event)"
    [complaintId]="selectedComplaintId" [complaint]="complaint"></app-edit-complaint-modal>
}

@if (complaintToDelete) {
    <app-delete-complaint-modal [complaint]="complaintToDelete"
    (CancelDelete)="CloseDeleteModal()"
    (ConfirmDelete)="DeleteComplaint($event)"></app-delete-complaint-modal>
}
