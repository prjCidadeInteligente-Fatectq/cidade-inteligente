@if (complaint) {
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Excluir denúncia</h3>
            </div>

            <div class="modal-body">
                <p class="warning">Tem certeza que deseja excluir esta denúncia?</p>

                <div class="complaint-info">
                    <div class="info-row">
                        <span class="label">ID</span>
                        <span class="value">{{ complaint.id }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Rua</span>
                        <span class="value">{{ complaint.street }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Bairro</span>
                        <span class="value">{{ complaint.neighborhood.name }}</span>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" (click)="Cancel()">Cancelar</button>
                <button type="button" class="btn-delete" (click)="Delete()">Excluir</button>
            </div>
        </div>
    </div>
}
